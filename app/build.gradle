plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '2.1.0-1.0.29'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {

    namespace = 'com.aaryo.selfattendance'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.aaryo.selfattendance"
        minSdk = 24
        targetSdk = 36

        versionCode (System.getenv("VERSION_CODE")?.toInteger()
                  ?: System.getenv("GITHUB_RUN_NUMBER")?.toInteger()
                  ?: 805)
        versionName "1.0.9"

        vectorDrawables.useSupportLibrary = true
        buildConfigField "String", "FIREBASE_API_KEY", "\"debug_key\""
        buildConfigField "boolean", "IS_AMAZON", "false"
        buildConfigField "String", "STORE_NAME", "\"play\""

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {

        debug {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
        }

        release {
            if (file("keystore.jks").exists() && System.getenv("KEYSTORE_PASSWORD")) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
            minifyEnabled = true
            shrinkResources = true
            debuggable = false

            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )

            buildConfigField "String", "FIREBASE_API_KEY", "\"prod_key\""
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
        disable 'GradleDependency', 'OldTargetApi'
    }
}

ksp {
    arg("room.incremental", "true")
    arg("room.generateKotlin", "true")
    arg("room.expandProjection", "true")
}

dependencies {

    implementation 'androidx.core:core-ktx:1.16.0'

    // Lifecycle — 2.9.0
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.0'

    // Activity — 1.10.1
    implementation 'androidx.activity:activity-compose:1.10.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Compose BOM — 2024.12.01 (original, confirmed working)
    implementation platform('androidx.compose:compose-bom:2024.12.01')

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.0"

    // Navigation Compose — 2.9.0
    implementation 'androidx.navigation:navigation-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Room — 2.7.1
    implementation "androidx.room:room-runtime:2.7.1"
    implementation "androidx.room:room-ktx:2.7.1"
    ksp "androidx.room:room-compiler:2.7.1"

    // Firebase BOM — 33.5.1 (original confirmed-working; -ktx aliases still present)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')

    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-functions-ktx'
    implementation 'com.google.firebase:firebase-config-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'

    // Credential Manager — 1.3.0 (original)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // AdMob — 24.1.0
    implementation 'com.google.android.gms:play-services-ads:24.1.0'

    implementation "androidx.core:core-splashscreen:1.0.1"

    // WorkManager — 2.10.1
    implementation "androidx.work:work-runtime-ktx:2.10.1"

    // Biometric — 1.1.0 (original; 1.2.0 does not exist on Maven)
    implementation "androidx.biometric:biometric:1.1.0"

    // Security Crypto
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Lottie — 6.6.2
    implementation "com.airbnb.android:lottie-compose:6.6.2"

    implementation 'com.google.android.material:material:1.12.0'

    // UMP SDK — 2.2.0 (original)
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'

    // App Update — 2.1.0
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Google Play In-App Review — 2.0.2
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:review-ktx:2.0.2'

    // Play Integrity — 1.4.0
    implementation 'com.google.android.play:integrity:1.4.0'

    // Google Play Billing — 8.0.0
    // ✅ Google Play requirement: 8.0.0+
    // See migration guide: https://developer.android.com/google/play/billing/migrate-to-latest
    implementation 'com.android.billingclient:billing-ktx:8.0.0'

    // QR Code
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
