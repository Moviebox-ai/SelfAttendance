org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
room.incremental=true
room.expandProjection=true
room.generateKotlin=true
android.suppressUnsupportedCompileSdk=35,36
org.gradle.warning.mode=none
kotlin.incremental=true
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8

# R8 Full Mode & Resource Optimization
android.enableR8.fullMode=true
android.enableResourceOptimizations=true
android.enableNewResourceShrinker=true
android.enableNewResourceShrinker.preciseShrinking=true

